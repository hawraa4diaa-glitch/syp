<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معلومات جوالك</title>
<style>
:root{--bg:#050807;--fg:#d6ffe0;--dim:#6f9a7b;--red:#ff4d4d;--row:#0d1512;--line:#1d3a2c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:22px 16px 36px}
h1{font-size:28px;line-height:1.4;margin:0 0 4px;color:#fff}
.sub{color:var(--dim);font-size:17px;margin:0 0 18px;min-height:26px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--row);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:9px 0;font-size:20px;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}
.row.show{opacity:1;transform:none}
.row .k{color:var(--dim);flex:none}
.row .v{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--fg);word-break:break-word;font-size:19px}
.live{display:none;margin:18px 0 0;text-align:center}.live.show{display:block}.live p{font-size:19px;margin:0 0 10px}.box{position:relative;width:200px;height:200px;margin:0 auto;border:2px solid var(--line);border-radius:50%;background:var(--row)}.box i{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--fg);left:50%;top:50%}.end{display:none;margin-top:18px;background:var(--red);color:#fff;border-radius:12px;padding:16px;font-size:22px;font-weight:700;text-align:center;line-height:1.5}
.end.show{display:block}
.note{color:var(--dim);font-size:13px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<main>
  <h1 id="h">جاري قراءة جوالك…</h1>
  <p class="sub" id="s">انتظر ثواني</p>
  <div id="rows"></div>
  <div class="live" id="live"><p>حرّك جوالك وشوف: هذه حركة يدك الآن</p><div class="box"><i id="dot"></i></div></div>
  <div class="end" id="end">كل هذا وصلنا له بدون ما تضغط أو تسمح بأي شيء</div>
  <p class="note" id="n"></p>
</main>
<script>
const sleep=ms=>new Promise(x=>setTimeout(x,matchMedia('(prefers-reduced-motion:reduce)').matches?0:ms));
async function gather(){
  const n=navigator,ua=n.userAgent;let os='غير معروف';
  let model=null;
  if(/iPhone|iPad/.test(ua))os='iOS';
  else if(/Android/.test(ua)){os='Android';
    try{const h=await n.userAgentData.getHighEntropyValues(['platformVersion','model']);
      if(h.platformVersion)os='Android '+parseInt(h.platformVersion);
      if(h.model&&h.model.length>1)model=h.model}catch(e){}}
  else if(/Windows/.test(ua))os='Windows';else if(/Mac OS X/.test(ua))os='macOS';else if(/Linux/.test(ua))os='Linux';
  let br='غير معروف';
  if(/EdgA?\//.test(ua))br='Edge';else if(/SamsungBrowser/.test(ua))br='Samsung Internet';else if(/CriOS|Chrome\//.test(ua))br='Chrome';else if(/FxiOS|Firefox/.test(ua))br='Firefox';else if(/Safari/.test(ua))br='Safari';
  let gpu=null;
  try{const g=document.createElement('canvas').getContext('webgl');const e=g.getExtension('WEBGL_debug_renderer_info');if(e)gpu=g.getParameter(e.UNMASKED_RENDERER_WEBGL)}catch(e){}
  let bat=null,batT=null;
  try{if(n.getBattery){const b=await n.getBattery();bat=Math.round(b.level*100)+'%'+(b.charging?' ⚡':'');const sec=b.charging?b.chargingTime:b.dischargingTime;if(isFinite(sec)&&sec>0){const h=Math.floor(sec/3600),m=Math.round(sec%3600/60);batT=(b.charging?'يكتمل الشحن بعد ':'ينطفي بعد ')+(h?h+' ساعة و ':'')+m+' دقيقة'}}}catch(e){}
  const c=n.connection||{};
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  const cmap={'Asia/Riyadh':'السعودية','Asia/Dubai':'الإمارات','Asia/Kuwait':'الكويت','Asia/Qatar':'قطر','Asia/Bahrain':'البحرين','Asia/Muscat':'عُمان','Africa/Cairo':'مصر','Asia/Amman':'الأردن'};
  const tzc={'Asia/Riyadh':'SA','Asia/Dubai':'AE','Asia/Kuwait':'KW','Asia/Qatar':'QA','Asia/Bahrain':'BH','Asia/Muscat':'OM','Africa/Cairo':'EG','Asia/Amman':'JO','Asia/Baghdad':'IQ','Asia/Beirut':'LB','Asia/Damascus':'SY','Asia/Aden':'YE','Africa/Casablanca':'MA','Africa/Tunis':'TN','Africa/Algiers':'DZ','Africa/Khartoum':'SD','Africa/Tripoli':'LY','Asia/Karachi':'PK','Asia/Kolkata':'IN','Asia/Dhaka':'BD','Asia/Manila':'PH','Asia/Jakarta':'ID','Europe/Istanbul':'TR','Europe/London':'GB','Europe/Paris':'FR','Europe/Berlin':'DE','America/New_York':'US','America/Chicago':'US','America/Los_Angeles':'US'};
  let cc=tzc[tz]||((n.language||'').split('-')[1]||'').toUpperCase();
  let country=null;
  try{if(/^[A-Z]{2}$/.test(cc)){country=String.fromCodePoint(...[...cc].map(c=>127397+c.charCodeAt(0)))+' '+new Intl.DisplayNames(['ar'],{type:'region'}).of(cc)}}catch(e){}
  let cams=0,mics=0;
  try{const dv=await n.mediaDevices.enumerateDevices();cams=dv.filter(x=>x.kind==='videoinput').length;mics=dv.filter(x=>x.kind==='audioinput').length}catch(e){}
  let free=null;
  try{const q=await n.storage.estimate();if(q.quota&&q.usage!==undefined)free=Math.round((q.quota-q.usage)/1073741824)+' GB'}catch(e){}
  let visits=1;
  try{visits=(+localStorage.getItem('v')||0)+1;localStorage.setItem('v',visits)}catch(e){}
  let fp=null;
  try{const cv=document.createElement('canvas');cv.width=220;cv.height=40;const x=cv.getContext('2d');x.font='18px Arial';x.fillStyle='#f60';x.fillRect(10,5,80,25);x.fillStyle='#069';x.fillText('fingerprint 🛰',12,26);
    let h=5381;const s=cv.toDataURL()+ua+screen.width+screen.height+tz;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;fp=h.toString(16).toUpperCase().padStart(8,'0')}catch(e){}
  const hzv=await new Promise(r=>{let f=0,st;const l=t=>{if(!st)st=t;f++;t-st<500?requestAnimationFrame(l):r(f*1000/(t-st))};requestAnimationFrame(l)});
  const hz=[30,48,60,72,90,120,144].reduce((a,b)=>Math.abs(b-hzv)<Math.abs(a-hzv)?b:a);
  let fonts=null;
  try{const L=['Arial','Verdana','Tahoma','Times New Roman','Courier New','Georgia','Trebuchet MS','Impact','Comic Sans MS','Helvetica','Calibri','Cambria','Segoe UI','Roboto','Noto Sans','Menlo','Monaco','Consolas','Futura','Gill Sans','Optima','Palatino','Garamond','Avenir','Didot'];
    const cx=document.createElement('canvas').getContext('2d'),w=f=>{cx.font='72px '+f;return cx.measureText('mmmmmmmmmmlli').width},b1=w('monospace'),b2=w('serif'),b3=w('sans-serif');
    const k=L.filter(f=>w("'"+f+"',monospace")!==b1||w("'"+f+"',serif")!==b2||w("'"+f+"',sans-serif")!==b3).length;if(k>=3)fonts=k+' خط على الأقل'}catch(e){}
  const mo=await new Promise(r=>{let d=false;const h=e=>{const a=e.accelerationIncludingGravity;if(a&&a.z!=null&&!d){d=true;removeEventListener('devicemotion',h);r(a)}};try{addEventListener('devicemotion',h)}catch(e){}setTimeout(()=>{if(!d){removeEventListener('devicemotion',h);r(null)}},700)});
  let pose=null;if(mo){const z=Math.abs(mo.z||0);pose=z>9?'مرمي على الطاولة':'ماسكه بيدك الحين، ميلانه '+Math.round(Math.acos(Math.min(1,z/9.81))*180/Math.PI)+'°'}
  const rows=[
    ['نظام الجوال',os],
    ['المتصفح',br],
    ['لغة الجوال',(n.languages||[n.language])[0]],
    ['المنطقة الزمنية',tz],
    ['الوقت عندك الآن',new Date().toLocaleTimeString('en-GB')],
    ['مقاس الشاشة',screen.width+' × '+screen.height],
    ['عدد أنوية المعالج',n.hardwareConcurrency],
    ['كرت الشاشة',gpu],
    ['البطارية',bat],
    ['تصنيف سرعة الإنترنت',c.effectiveType?c.effectiveType.toUpperCase():null],
    ['الوضع الداكن',matchMedia('(prefers-color-scheme:dark)').matches?'شغّال':'مطفي'],
    ['موديل جوالك',model],
    ['الكاميرا والميكروفون',(cams&&mics)?'عرفنا أنهما موجودان':null],
    ['سرعة عرض شاشتك الآن',hz+' Hz'],
    ['كم باقي للبطارية',batT],
    ['وضع جوالك الآن',pose],
    ['بصمة جوالك (رقم يميّزه)',fp],
    ['عدد زياراتك لهذه الصفحة',visits>1?'زيارة رقم '+visits+' — عرفناك!':'أول زيارة — المرة الجاية نعرفك']
  ];
  return rows.filter(r=>r[1]!==null&&r[1]!==undefined&&r[1]!=='');
}
(async()=>{
  const rows=await gather(),box=document.getElementById('rows');
  await sleep(900);
  document.getElementById('s').textContent='هذه معلومات جوالك أنت:';
  for(const [k,v] of rows){
    const d=document.createElement('div');d.className='row';
    d.innerHTML='<span class="k"></span><span class="v"></span>';
    d.firstChild.textContent=k;d.lastChild.textContent=v;box.appendChild(d);
    await sleep(40);d.classList.add('show');await sleep(550);
  }
  const lv=document.getElementById('live'),dot=document.getElementById('dot');
  addEventListener('devicemotion',e=>{const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;lv.classList.add('show');
    const k=44/9.81,cl=v=>Math.max(6,Math.min(94,v));dot.style.left=cl(50+a.x*k)+'%';dot.style.top=cl(50-a.y*k)+'%'});
  await sleep(900);
  document.getElementById('h').textContent='هذه معلومات جوالك';
  document.getElementById('end').classList.add('show');
  document.getElementById('n').textContent='لا يُرسل شيء لأي مكان. فقط عدد زياراتك يُحفظ داخل جوالك أنت.';
})();
</script>
</body>
</html>
